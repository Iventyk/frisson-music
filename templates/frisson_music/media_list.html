{% extends "base.html" %}

{% block content %}
  <div class="container-fluid mt-4">
    <div class="row">
      {% for media in media_list %}
        <div class="col-md-3 mb-0 d-flex">
          <div class="card media-card w-100">
            <a
                href="{% url "media-detail" media_title=media.media_title %}"
                class="text-decoration-none text-light h-100"
            >
              <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">

                <h5 class="card-title media-title">
                  {{ media.media_title }}
                </h5>

                <p class="media-type text-muted">
                  {{ media.media_type|title }}
                </p>

              </div>
            </a>
          </div>
        </div>
      {% empty %}
        <p class="text-light">Database is Empty 😢</p>
      {% endfor %}
    </div>
  </div>
{% endblock %}
